<section class="cookie su-scuro" aria-labelledby="cookie-titolo" data-cookie hidden>
  <div class="cookie__testo">
    <h2 class="cookie__titolo" id="cookie-titolo">Un biscotto prima del pranzo?</h2>
    <p class="testo-s">Usiamo cookie tecnici per far funzionare il sito e, solo con il tuo consenso, cookie statistici per migliorarlo. Puoi cambiare idea quando vuoi da «Preferenze cookie».</p>
    <label class="cookie__opzione" data-cookie-opzioni hidden>
      <input type="checkbox" data-cookie-statistici> Cookie statistici (anonimi)
    </label>
  </div>
  <div class="cookie__azioni">
    <button class="btn btn--testo cookie__personalizza" type="button" data-cookie-personalizza>Personalizza</button>
    <button class="btn btn--secondario" type="button" data-cookie-scelta="rifiuta">Rifiuta</button>
    <button class="btn btn--su-scuro" type="button" data-cookie-scelta="accetta">Accetta</button>
  </div>
</section>
